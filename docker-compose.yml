services:
  ai-server:
    build: .
    image: fastapi-ai-server
    container_name: fastapi-ai
    restart: unless-stopped
    ports:
      - "18000:8000"
      - "16379:6379"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?请在 .env 中配置 DOCKER_DATABASE_URL，指向本机 MySQL}
      PORT: 8000
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./data/chroma_db:/app/data/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: fastapi-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

volumes:
  redis-data:

networks:
  app-net:
    driver: bridge
