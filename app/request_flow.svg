<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Inter', system-ui, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L8,5 L0,9" fill="none" stroke="#3b82f6" stroke-width="2"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="720" fill="#f8fafc" rx="10"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="960" height="48" fill="#0f172a" rx="10"/>
  <rect x="0" y="30" width="960" height="18" fill="#0f172a"/>
  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="1">FastAPI AI Service — HTTP 请求生命周期</text>

  <!-- 时间轴纵线 -->
  <line x1="100" y1="75" x2="100" y2="660" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ===== 步骤条目 ===== -->
  <!-- 步骤1 -->
  <circle cx="100" cy="115" r="14" fill="#3b82f6"/>
  <text x="100" y="120" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">1</text>
  <text x="65" y="115" text-anchor="end" fill="#64748b" font-size="11">客户端</text>

  <g filter="url(#shadow)">
    <rect x="130" y="98" width="180" height="34" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="220" y="119" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="600">{method} {path}</text>
    <text x="220" y="135" text-anchor="middle" fill="#3b82f6" font-size="10">{headers}</text>
  </g>

  <!-- 箭头 -->
  <line x1="310" y1="115" x2="440" y2="115" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-active)"/>

  <!-- 步骤2 -->
  <circle cx="100" cy="195" r="14" fill="#64748b"/>
  <text x="100" y="200" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">2</text>
  <text x="65" y="195" text-anchor="end" fill="#64748b" font-size="11">中间件栈</text>

  <g filter="url(#shadow)">
    <rect x="130" y="170" width="540" height="55" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    
    <rect x="140" y="180" width="165" height="35" rx="6" fill="#f1f5f9"/>
    <text x="222" y="198" text-anchor="middle" fill="#475569" font-size="11">🔓 ApiEncryptMiddleware</text>
    <text x="222" y="212" text-anchor="middle" fill="#94a3b8" font-size="9">解密 / 签名校验（可选）</text>

    <rect x="317" y="180" width="165" height="35" rx="6" fill="#f1f5f9"/>
    <text x="399" y="198" text-anchor="middle" fill="#475569" font-size="11">📝 RequestLogMiddleware</text>
    <text x="399" y="212" text-anchor="middle" fill="#94a3b8" font-size="9">记录请求 / 响应日志</text>

    <rect x="494" y="180" width="165" height="35" rx="6" fill="#f1f5f9"/>
    <text x="576" y="198" text-anchor="middle" fill="#475569" font-size="11">🌐 CORSMiddleware</text>
    <text x="576" y="212" text-anchor="middle" fill="#94a3b8" font-size="9">跨域检查</text>
  </g>

  <!-- 箭头 -->
  <line x1="670" y1="198" x2="760" y2="198" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-active)"/>

  <!-- 步骤3 -->
  <circle cx="100" cy="280" r="14" fill="#3b82f6"/>
  <text x="100" y="285" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">3</text>
  <text x="65" y="280" text-anchor="end" fill="#64748b" font-size="11">路由 + 依赖</text>

  <g filter="url(#shadow)">
    <rect x="130" y="250" width="540" height="65" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    
    <rect x="140" y="260" width="100" height="28" rx="6" fill="#dbeafe"/>
    <text x="190" y="279" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="600">路由匹配</text>

    <line x1="250" y1="274" x2="280" y2="274" stroke="#bfdbfe" stroke-width="1.5"/>

    <rect x="290" y="260" width="120" height="28" rx="6" fill="#dbeafe"/>
    <text x="350" y="279" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="600">get_session</text>

    <rect x="420" y="260" width="120" height="28" rx="6" fill="#dbeafe"/>
    <text x="480" y="279" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="600">get_current_user</text>

    <rect x="550" y="260" width="110" height="28" rx="6" fill="#dbeafe"/>
    <text x="605" y="279" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="600">PageParams</text>

    <text x="405" y="305" text-anchor="middle" fill="#60a5fa" font-size="10">fastapi.Depends() 自动注入</text>
  </g>

  <!-- 箭头 -->
  <line x1="670" y1="283" x2="760" y2="283" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-active)"/>

  <!-- 步骤4 -->
  <circle cx="100" cy="380" r="14" fill="#16a34a"/>
  <text x="100" y="385" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">4</text>
  <text x="65" y="380" text-anchor="end" fill="#64748b" font-size="11">Controller</text>

  <g filter="url(#shadow)">
    <rect x="130" y="358" width="540" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    
    <rect x="140" y="365" width="520" height="32" rx="6" fill="#dcfce7"/>
    <text x="400" y="380" text-anchor="middle" fill="#15803d" font-size="12">async def list_users(page_params, db, current_user) → Service.get_user_list(...)</text>
    <text x="400" y="396" text-anchor="middle" fill="#86efac" font-size="10">校验参数 · 调用 Service · 返回 Response.success(data)</text>
  </g>

  <!-- 箭头 -->
  <line x1="670" y1="382" x2="760" y2="382" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 步骤5 -->
  <circle cx="100" cy="465" r="14" fill="#dc2626"/>
  <text x="100" y="470" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">5</text>
  <text x="65" y="465" text-anchor="end" fill="#64748b" font-size="11">Service / DB</text>

  <g filter="url(#shadow)">
    <rect x="130" y="438" width="540" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    
    <rect x="140" y="448" width="240" height="38" rx="6" fill="#fee2e2"/>
    <text x="260" y="467" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="600">🛢️ SQLAlchemy ORM → MySQL</text>
    <text x="260" y="482" text-anchor="middle" fill="#fca5a5" font-size="9">select(User) → paginate()</text>

    <rect x="392" y="448" width="180" height="38" rx="6" fill="#fee2e2"/>
    <text x="482" y="467" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="600">⚡ Redis</text>
    <text x="482" y="482" text-anchor="middle" fill="#fca5a5" font-size="9">缓存 / 限流 / 验证码</text>

    <rect x="584" y="448" width="75" height="38" rx="6" fill="#fecaca"/>
    <text x="621" y="473" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="600">返回</text>
  </g>

  <!-- 箭头（返回路线） -->
  <line x1="670" y1="465" x2="760" y2="465" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 步骤6 -->
  <circle cx="100" cy="555" r="14" fill="#64748b"/>
  <text x="100" y="560" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">6</text>
  <text x="65" y="555" text-anchor="end" fill="#64748b" font-size="11">响应返回</text>

  <g filter="url(#shadow)">
    <rect x="130" y="530" width="540" height="48" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    
    <rect x="140" y="538" width="130" height="32" rx="6" fill="#f1f5f9"/>
    <text x="205" y="558" text-anchor="middle" fill="#475569" font-size="11">Controller 响应</text>

    <line x1="280" y1="554" x2="310" y2="554" stroke="#cbd5e1" stroke-width="1.5"/>

    <rect x="320" y="538" width="130" height="32" rx="6" fill="#f1f5f9"/>
    <text x="385" y="558" text-anchor="middle" fill="#475569" font-size="11">中间件反向通过</text>

    <line x1="460" y1="554" x2="490" y2="554" stroke="#cbd5e1" stroke-width="1.5"/>

    <rect x="500" y="538" width="155" height="32" rx="6" fill="#f1f5f9"/>
    <text x="577" y="558" text-anchor="middle" fill="#475569" font-size="11">Uvicorn → JSON</text>
  </g>

  <!-- 箭头回客户端 -->
  <line x1="130" y1="615" x2="75" y2="615" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-active)"/>
  <rect x="130" y="600" width="180" height="30" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="220" y="619" text-anchor="middle" fill="#1d4ed8" font-size="12" font-weight="600">✅ JSON Response</text>

  <!-- ===== 底部图例 ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="665" width="900" height="40" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    
    <rect x="50" y="675" width="14" height="14" rx="4" fill="#3b82f6"/>
    <text x="70" y="687" fill="#475569" font-size="11">请求</text>

    <line x1="130" y1="682" x2="160" y2="682" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="168" y="687" fill="#475569" font-size="11">流向</text>

    <rect x="240" y="675" width="14" height="14" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="260" y="687" fill="#475569" font-size="11">路由/依赖</text>

    <rect x="380" y="675" width="14" height="14" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="400" y="687" fill="#475569" font-size="11">Controller</text>

    <rect x="520" y="675" width="14" height="14" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="540" y="687" fill="#475569" font-size="11">Service/DB</text>

    <rect x="660" y="675" width="14" height="14" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="680" y="687" fill="#475569" font-size="11">中间件</text>

    <rect x="800" y="675" width="14" height="14" rx="4" fill="#0f172a"/>
    <text x="820" y="687" fill="#475569" font-size="11">步骤序号</text>
  </g>
</svg>
