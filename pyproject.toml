[project]
name = "fastapi-ai-service"
version = "1.0.0"
description = "企业级 FastAPI AI 接口服务（三层架构）"
requires-python = ">=3.11"
# 运行依赖只维护 requirements.txt，项目安装时从同一文件读取。
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pre-commit>=3.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# 仅发现应用与配置包，避免把数据、上传文件等目录识别为 Python 包。
[tool.setuptools.packages.find]
include = ["app", "app.*", "config", "config.*"]

# ========================================
# ruff — Python linter & formatter
# ========================================
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", "__pycache__", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "E501",     # 行长规则由 formatter 处理
    "N818",     # AppException 命名已全局使用，不改
    "RUF001",   # 中文注释中 Unicode 字符是正常的
    "RUF002",   # 中文文档中 Unicode 字符是正常的
    "RUF003",   # 中文注释中 Unicode 字符是正常的
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ========================================
# pytest
# ========================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
